name: 급식 알림

on:
  schedule:
    - cron: "30 22 * * 0-4"   # 평일 아침 07:30 KST
    - cron: "30 2 * * 1-5"    # 평일 점심 전 11:30 KST
  workflow_dispatch:
    inputs:
      mode:
        description: "morning 또는 lunch (비우면 시각에 맞춰 자동)"
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 급식 알림 보내기
        run: python meal.py
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode }}
